<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Keyring Motion - Clean Preview</title>
        <style>
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                background: radial-gradient(circle at 50% 35%, #fff 0%, #f4edff 70%, #ece2ff 100%);
                color: #382b54;
                font-family:
                    system-ui,
                    -apple-system,
                    sans-serif;
                display: grid;
                place-items: center;
            }
            .wrap {
                text-align: center;
                padding: 20px;
            }
            h1 {
                font-size: 19px;
                margin: 0 0 6px;
            }
            .sub {
                font-size: 12px;
                color: #786b94;
                margin: 0 0 8px;
            }
            .stage {
                width: min(68vw, 390px);
                margin: auto;
                overflow: visible;
            }
            .keyring {
                width: 100%;
                height: auto;
                display: block;
                transform-origin: 53% 3%;
                animation: sway 3.6s ease-in-out infinite;
                filter: drop-shadow(0 14px 16px #54347722);
                will-change: transform;
            }
            @keyframes sway {
                0%,
                100% {
                    transform: rotate(-2deg);
                }
                25% {
                    transform: rotate(1.6deg);
                }
                50% {
                    transform: rotate(2.4deg);
                }
                75% {
                    transform: rotate(-1.2deg);
                }
            }
            .paused .keyring {
                animation-play-state: paused;
            }
            button {
                border: 1px solid #a985d4;
                background: white;
                color: #673ca0;
                border-radius: 30px;
                padding: 10px 25px;
                cursor: pointer;
            }
            .note {
                max-width: 400px;
                font-size: 12px;
                color: #786b94;
                margin: 14px auto 0;
                line-height: 1.5;
            }
            @media (prefers-reduced-motion: reduce) {
                .keyring {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <main class="wrap">
            <h1>Keyring Motion · Clean Version</h1>
            <p class="sub">원본 PNG 그대로 · 잘림 없는 고화질 미리보기</p>
            <div class="stage">
                <img class="keyring" src="assets/keyring.png" alt="보라색 키링" />
            </div>
            <button
                id="toggle"
                onclick="
                    document.body.classList.toggle('paused');
                    this.textContent = document.body.classList.contains('paused')
                        ? '재생'
                        : '일시정지';
                "
            >
                일시정지
            </button>
            <p class="note">
                이 버전은 이미지 손상을 막기 위해 전체를 부드럽게 흔듭니다. 장식별 독립 움직임은
                정교한 레이어 복원 작업이 추가로 필요합니다.
            </p>
        </main>
    </body>
</html>
